<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SINIKAT PRODUCTIONS CALCULATOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0d0d0d;--line:#2a2a2a;--text:#f5f2ea;--mute:#9a968a;--gold:#c9a24b;--gold2:#e6c978}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Jost,"Segoe UI",system-ui,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{text-align:center;padding:calc(34px + env(safe-area-inset-top,0px)) 16px 26px;border-bottom:1px solid var(--line)}
.logo{font-weight:500;font-size:clamp(34px,9vw,60px);letter-spacing:.14em;line-height:1;margin:0}
.logo span{margin-left:-.14em}
.lg{width:min(72vw,360px);height:auto}
.sub{letter-spacing:.7em;margin:12px -.7em 0 0;font-size:clamp(10px,2.6vw,14px);font-weight:400}
.app{font-weight:300;color:var(--gold);margin:18px 0 0;letter-spacing:.12em;font-size:13px}
main{max-width:1040px;margin:0 auto;padding:20px 16px;display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:900px){main{grid-template-columns:1fr 340px;align-items:start}.side{position:sticky;top:16px}}
h2{font-weight:500;font-size:19px;color:var(--gold);margin:26px 0 8px;letter-spacing:.04em}
h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:6px 12px;align-items:center;padding:14px 12px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;border-radius:6px;cursor:pointer;transition:border-color .15s}
.row.on{border-color:var(--gold)}
.box{width:22px;height:22px;border:1.5px solid var(--mute);border-radius:4px;display:grid;place-items:center;font-size:14px;color:#000}
.row.on .box{background:var(--gold);border-color:var(--gold)}
.nm{font-weight:500}
.pr{color:var(--mute);font-size:14px}
.lt{color:var(--gold2);font-weight:500;text-align:right}
.qty{grid-column:2/4;display:none;align-items:center;gap:10px}
.row.on .qty{display:flex}
.qty button{width:40px;height:40px;border:1px solid var(--line);background:#000;border-radius:6px;font-size:20px}
.qty input{width:64px;height:40px;text-align:center;background:#000;border:1px solid var(--line);border-radius:6px}
.qty small{color:var(--mute)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:18px}
label.f{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],select{width:100%;height:44px;padding:0 12px;background:#000;border:1px solid var(--line);border-radius:6px}
.tot{display:flex;justify-content:space-between;padding:6px 0}
.tot.g{border-top:1px solid var(--gold);margin-top:10px;padding-top:14px;font-size:22px;font-weight:500;color:var(--gold2)}
.btn{display:block;width:100%;min-height:46px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold2);font-weight:500;letter-spacing:.05em;margin-top:10px;padding:0 14px}
.btn.p{background:var(--gold);color:#000}
.btn.sm{width:auto;display:inline-block;margin:0;min-height:38px}
.btn.d{border-color:#7a3030;color:#e08a8a}
.bar{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
@media(min-width:900px){.bar{display:none}body{padding-bottom:30px}}
.bar b{font-size:20px;color:var(--gold2);font-weight:500}
.bar .btn{width:auto;margin:0}
footer{text-align:center;color:var(--mute);font-size:13px;padding:10px 16px}
footer button{background:none;border:0;color:var(--mute);text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;overflow:auto;z-index:10;padding:16px}
.ov.show{display:block}
.sheet{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:22px}
.q{background:#fff;color:#111;padding:26px;border-radius:4px}
.q h3{margin:0;font-weight:500;letter-spacing:.14em;font-size:24px}
.q .gl{height:2px;background:var(--gold);margin:12px 0}
.q table{width:100%;border-collapse:collapse;font-size:14px}
.q th{text-align:left;border-bottom:1px solid #bbb;padding:6px 4px;font-weight:500}
.q td{padding:6px 4px;border-bottom:1px solid #eee;vertical-align:top}
.q .r{text-align:right;white-space:nowrap}
.q .gt td{font-weight:600;font-size:17px;border-top:2px solid #111;border-bottom:0}
.q ul{font-size:13px;padding-left:18px;margin:6px 0 0;color:#333}
.q p{margin:4px 0;font-size:14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{margin:0}
.ar{display:grid;grid-template-columns:1fr 96px;gap:6px;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px}
.ar .x{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.ar select{height:38px;width:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 18px;border-radius:6px;z-index:20;display:none}
@media print{
 body>*:not(#qm){display:none!important}
 #qm{position:static;background:#fff;padding:0;display:block;overflow:visible}
 .sheet{border:0;padding:0;background:#fff;max-width:none}
 .acts,.noprint{display:none!important}
 .q{padding:0}
}
</style>
</head>

<main>
 <section id="list"></section>
 <aside class="side">
  <div class="card">
   <label class="f" for="cust" style="margin-top:0">Customer name</label>
   <input type="text" id="cust" placeholder="Full name or company" autocomplete="name">
   <label class="f" for="contact">Contact number / email</label>
   <input type="text" id="contact" autocomplete="tel">
   <label class="f" for="proj">Project / event</label>
   <input type="text" id="proj" placeholder="e.g. Birthday, 12 Dec">
   <h2 style="font-size:16px;margin-top:20px">Additional charges</h2>
   <label class="f" for="trans">Transportation (₱)</label>
   <input type="number" id="trans" min="0" inputmode="decimal" placeholder="0">
   <label class="f" for="olab">Other charge – description</label>
   <input type="text" id="olab" placeholder="e.g. Location fee">
   <label class="f" for="oamt">Other charge (₱)</label>
   <input type="number" id="oamt" min="0" inputmode="decimal" placeholder="0">
   <div style="margin-top:18px">
    <div class="tot"><span>Subtotal</span><span id="sub">₱0</span></div>
    <div class="tot"><span>Additional charges</span><span id="add">₱0</span></div>
    <div class="tot g"><span>Grand total</span><span id="grand">₱0</span></div>
   </div>
   <button class="btn p" id="gen">Generate Quotation</button>
   <button class="btn" id="clr">Clear All</button>
  </div>
 </aside>
</main>

<footer>Prices are starting rates. <button id="hist">Quotation history</button> · <button id="adm">Admin settings</button></footer>

<div class="bar"><div><small style="color:var(--mute)">Grand total</small><br><b id="gbar">₱0</b></div><button class="btn p" id="gen2">Generate Quotation</button></div>

<div class="ov" id="am"><div class="sheet" id="abody"></div></div>
<div class="ov" id="hm"><div class="sheet" id="hbody"></div></div>
<div class="ov" id="qm"><div class="sheet"><div class="q" id="qbody"></div>
 <div class="acts">
  <button class="btn" id="bp">Print Quotation</button>
  <button class="btn" id="bd">Download as PDF</button>
  <button class="btn" id="bc">Copy Quotation</button>
  <button class="btn p" id="bn">Start New Calculation</button>
  <button class="btn" id="bs" style="grid-column:1/-1">Share quotation</button>
  <button class="btn" id="bx" style="grid-column:1/-1">Back to calculator</button>
 </div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const CATS={photo:'Photography Services',video:'Videoshoot Services',extra:'Additional Services'};
const NOTES=['All services are currently mobile-phone based.','Prices are starting rates and may vary depending on project requirements.','Transportation expenses may be charged separately.','Same-Day Edit is subject to availability.','Additional hours and overtime require prior approval.'];
const DEF=[
 {id:'p1',cat:'photo',name:'Basic Photography with Color Grading',price:500,unit:'',start:true},
 {id:'p2',cat:'photo',name:'Portrait Photography',price:700,unit:'',start:true},
 {id:'p3',cat:'photo',name:'RAW Photography (Unedited Files)',price:500,unit:'',start:true},
 {id:'v1',cat:'video',name:'Basic Promotional Videoshoot',price:500,unit:'',start:true},
 {id:'v2',cat:'video',name:'Event Promotional Videoshoot',price:800,unit:'',start:true},
 {id:'v3',cat:'video',name:'Celebration Videoshoot',price:800,unit:'',start:true},
 {id:'v4',cat:'video',name:'Same-Day Edit (SDE) Videoshoot',price:1000,unit:'',start:true},
 {id:'e1',cat:'extra',name:'Add-on Hours',price:500,unit:'hour',start:false},
 {id:'e2',cat:'extra',name:'Overtime',price:500,unit:'hour',start:false},
 {id:'e3',cat:'extra',name:'Extra Photo Shoot',price:500,unit:'',start:true},
 {id:'e4',cat:'extra',name:'Extra Video Shoot',price:500,unit:'',start:true}];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let services=store.get('sk_services',DEF), pass=store.get('sk_pass','sinikat2026'), sel={}, authed=false;
const peso=n=>'₱'+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const pdfp=n=>'PHP '+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=s=>(s.start?'Starting at ':'')+peso(s.price)+(s.unit?'/'+s.unit:'');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2000)}

function render(){
 let h='';
 for(const c in CATS){
  const items=services.filter(s=>s.cat===c); if(!items.length)continue;
  h+=`<h2>${CATS[c]}</h2>`;
  for(const s of items){
   const q=sel[s.id],on=q!==undefined;
   h+=`<div class="row${on?' on':''}" data-id="${s.id}"><div class="box">${on?'✓':''}</div><div><div class="nm">${esc(s.name)}</div><div class="pr">${label(s)}</div></div><div class="lt">${on?peso(s.price*q):''}</div>
   <div class="qty"><button data-d="-1" aria-label="Decrease">−</button><input type="number" min="1" step="any" inputmode="decimal" value="${on?q:1}" aria-label="Quantity"><button data-d="1" aria-label="Increase">+</button><small>${s.unit?s.unit+'s':'qty'}</small></div></div>`;
  }
 }
 $('#list').innerHTML=h; totals();
}
function totals(){
 const sub=services.reduce((a,s)=>a+(sel[s.id]!==undefined?s.price*sel[s.id]:0),0);
 const add=(+$('#trans').value||0)+(+$('#oamt').value||0);
 $('#sub').textContent=peso(sub);$('#add').textContent=peso(add);
 $('#grand').textContent=$('#gbar').textContent=peso(sub+add);
 return {sub,add,total:sub+add};
}
$('#list').addEventListener('click',e=>{
 const row=e.target.closest('.row'); if(!row)return;
 const id=row.dataset.id, d=e.target.closest('button[data-d]');
 if(e.target.closest('input'))return;
 if(d){sel[id]=Math.max(1,(+sel[id]||1)+(+d.dataset.d));render();return}
 if(e.target.closest('.qty'))return;
 if(sel[id]===undefined)sel[id]=1;else delete sel[id];
 render();
});
$('#list').addEventListener('change',e=>{
 if(e.target.tagName!=='INPUT')return;
 const id=e.target.closest('.row').dataset.id;
 sel[id]=Math.max(0.5,+e.target.value||1);render();
});
['trans','oamt'].forEach(i=>$('#'+i).addEventListener('input',totals));
function clearAll(){sel={};['cust','contact','proj','trans','olab','oamt'].forEach(i=>$('#'+i).value='');render()}
$('#clr').onclick=()=>{if(confirm('Clear all selections and charges?'))clearAll()};

/* Quotation */
let Q=null;
function build(){
 const t=totals();
 const lines=services.filter(s=>sel[s.id]!==undefined).map(s=>({name:s.name,qty:sel[s.id],unit:s.unit,start:s.start,price:s.price,total:s.price*sel[s.id]}));
 const extras=[];
 if(+$('#trans').value>0)extras.push({name:'Transportation',amt:+$('#trans').value});
 if(+$('#oamt').value>0)extras.push({name:$('#olab').value.trim()||'Other charge',amt:+$('#oamt').value});
 return {id:Date.now(),contact:$('#contact').value.trim(),proj:$('#proj').value.trim(),name:$('#cust').value.trim()||'—',date:new Date().toLocaleDateString('en-PH',{year:'numeric',month:'long',day:'numeric'}),lines,extras,...t};
}
function openQuote(){
 Q=build();
 if(!Q.lines.length){toast('Select at least one service');return}
 saveHist(Q);showQuote();
}
function showQuote(){
 $('#qbody').innerHTML=`<h3>SINIKΛT PRODUCTIONS</h3><div class="gl"></div>
 <p><b>Quotation</b></p><p>Customer: <b>${esc(Q.name)}</b></p>${Q.contact?`<p>Contact: ${esc(Q.contact)}</p>`:''}${Q.proj?`<p>Project: ${esc(Q.proj)}</p>`:''}<p>Date: ${Q.date}</p>
 <table style="margin-top:10px"><tr><th>Service</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr>
 ${Q.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${l.qty}${l.unit?' '+l.unit+(l.qty>1?'s':''):''}</td><td class="r">${l.start?'from ':''}${peso(l.price)}</td><td class="r">${peso(l.total)}</td></tr>`).join('')}
 <tr><td colspan="3" class="r"><b>Subtotal</b></td><td class="r">${peso(Q.sub)}</td></tr>
 ${Q.extras.map(x=>`<tr><td colspan="3" class="r">${esc(x.name)}</td><td class="r">${peso(x.amt)}</td></tr>`).join('')}
 ${Q.extras.length?`<tr><td colspan="3" class="r"><b>Additional charges</b></td><td class="r">${peso(Q.add)}</td></tr>`:''}
 <tr class="gt"><td colspan="3" class="r">Grand Total</td><td class="r">${peso(Q.total)}</td></tr></table>
 <p style="margin-top:16px"><b>Important notes</b></p><ul>${NOTES.map(n=>`<li>${n}</li>`).join('')}</ul>`;
 $('#qm').classList.add('show');
}
$('#gen').onclick=$('#gen2').onclick=openQuote;
$('#bx').onclick=()=>$('#qm').classList.remove('show');
$('#bn').onclick=()=>{$('#qm').classList.remove('show');clearAll();scrollTo(0,0)};
$('#bp').onclick=()=>window.print();
function qtext(){
 let t='SINIKAT PRODUCTIONS\nQUOTATION\nCustomer: '+Q.name+(Q.contact?'\nContact: '+Q.contact:'')+(Q.proj?'\nProject: '+Q.proj:'')+'\nDate: '+Q.date+'\n\n';
 Q.lines.forEach(l=>t+=`• ${l.name} — ${l.qty}${l.unit?' '+l.unit+'(s)':''} x ${l.start?'from ':''}${peso(l.price)} = ${peso(l.total)}\n`);
 t+='\nSubtotal: '+peso(Q.sub)+'\n';
 Q.extras.forEach(x=>t+=x.name+': '+peso(x.amt)+'\n');
 t+='Additional charges: '+peso(Q.add)+'\nGRAND TOTAL: '+peso(Q.total)+'\n\nNotes:\n'+NOTES.map(n=>'- '+n).join('\n');
 return t;
}
$('#bc').onclick=async()=>{
 const t=qtext();
 try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 toast('Quotation copied');
};
$('#bd').onclick=()=>{
 if(!window.jspdf){toast('Opening print – choose “Save as PDF”');setTimeout(()=>window.print(),600);return}
 const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});let y=20;
 const chk=()=>{if(y>270){d.addPage();y=20}};
 d.setFont('helvetica','bold');d.setFontSize(20);d.text('SINIKAT PRODUCTIONS',15,y);y+=4;
 d.setDrawColor(201,162,75);d.setLineWidth(.8);d.line(15,y,195,y);y+=9;
 d.setFontSize(12);d.text('QUOTATION',15,y);y+=7;
 d.setFont('helvetica','normal');d.setFontSize(10);
 d.text('Customer: '+Q.name,15,y);y+=5;if(Q.contact){d.text('Contact: '+Q.contact,15,y);y+=5}if(Q.proj){d.text('Project: '+Q.proj,15,y);y+=5}d.text('Date: '+Q.date,15,y);y+=9;
 d.setFont('helvetica','bold');d.text('Service',15,y);d.text('Qty',120,y,{align:'right'});d.text('Price',155,y,{align:'right'});d.text('Amount',195,y,{align:'right'});y+=2;d.setLineWidth(.2);d.line(15,y,195,y);y+=6;
 d.setFont('helvetica','normal');
 Q.lines.forEach(l=>{chk();const n=d.splitTextToSize(l.name,90);d.text(n,15,y);
  d.text(String(l.qty)+(l.unit?' '+l.unit:''),120,y,{align:'right'});d.text((l.start?'from ':'')+pdfp(l.price),155,y,{align:'right'});d.text(pdfp(l.total),195,y,{align:'right'});y+=5*n.length+2});
 y+=2;d.line(15,y,195,y);y+=6;
 const rt=(a,b,bold)=>{chk();d.setFont('helvetica',bold?'bold':'normal');d.text(a,155,y,{align:'right'});d.text(b,195,y,{align:'right'});y+=6};
 rt('Subtotal',pdfp(Q.sub));Q.extras.forEach(x=>rt(x.name,pdfp(x.amt)));
 if(Q.extras.length)rt('Additional charges',pdfp(Q.add));
 d.setFontSize(12);rt('GRAND TOTAL',pdfp(Q.total),true);y+=6;
 d.setFontSize(10);d.setFont('helvetica','bold');d.text('Important notes',15,y);y+=6;d.setFont('helvetica','normal');d.setFontSize(9);
 NOTES.forEach(n=>{chk();const w=d.splitTextToSize('- '+n,175);d.text(w,15,y);y+=5*w.length});
 savePdf(d,'Sinikat-Quotation-'+Q.name.replace(/[^\w]+/g,'_')+'.pdf');
};

/* Admin */
$('#adm').onclick=()=>{authed=false;adminView();$('#am').classList.add('show')};
function adminView(){
 const b=$('#abody');
 if(!authed){
  b.innerHTML=`<h2>Admin login</h2><label class="f" for="ap">Password</label><input type="password" id="ap" autocomplete="current-password"><p class="pr" style="font-size:13px">Default password: sinikat2026 — change it after logging in.</p><button class="btn p" id="al">Log in</button><button class="btn" id="ac">Close</button>`;
  const go=()=>{if($('#ap').value===pass){authed=true;adminView()}else{toast('Wrong password')}};
  $('#al').onclick=go;$('#ap').onkeydown=e=>{if(e.key==='Enter')go()};$('#ac').onclick=()=>$('#am').classList.remove('show');return;
 }
 b.innerHTML=`<h2>Manage services &amp; rates</h2>`+services.map(s=>`<div class="ar" data-id="${s.id}">
  <input type="text" data-f="name" value="${esc(s.name)}" aria-label="Service name">
  <input type="number" data-f="price" min="0" value="${s.price}" aria-label="Price">
  <div class="x"><select data-f="cat" aria-label="Category">${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${k===s.cat?' selected':''}>${v}</option>`).join('')}</select>
  <label><input type="checkbox" data-f="start"${s.start?' checked':''}> Starting rate</label>
  <label>per <select data-f="unit"><option value="">item</option><option value="hour"${s.unit==='hour'?' selected':''}>hour</option></select></label>
  <button class="btn sm d" data-del>Delete</button></div></div>`).join('')+
 `<button class="btn" id="an">+ Add new service</button>
 <h2>Change password</h2><input type="password" id="np" placeholder="New password (min 4 characters)"><button class="btn" id="sp">Save password</button>
 <button class="btn" id="rs">Reset to default services</button>
 <button class="btn p" id="ad">Done</button>`;
 $('#ad').onclick=()=>{$('#am').classList.remove('show');authed=false};
 $('#an').onclick=()=>{services.push({id:'s'+Date.now(),cat:'extra',name:'New service',price:500,unit:'',start:true});save();adminView();scrollTo(0,document.body.scrollHeight)};
 $('#sp').onclick=()=>{const v=$('#np').value;if(v.length<4){toast('Password too short');return}pass=v;store.set('sk_pass',v);$('#np').value='';toast('Password saved')};
 $('#rs').onclick=()=>{if(confirm('Reset all services and prices to default?')){services=JSON.parse(JSON.stringify(DEF));sel={};save();adminView()}};
}
function save(){store.set('sk_services',services);render()}
$('#abody').addEventListener('change',e=>{
 const r=e.target.closest('.ar');if(!r)return;
 const s=services.find(x=>x.id===r.dataset.id),f=e.target.dataset.f;if(!s||!f)return;
 s[f]=f==='price'?Math.max(0,+e.target.value||0):f==='start'?e.target.checked:e.target.value;
 save();
});
$('#abody').addEventListener('click',e=>{
 if(!e.target.matches('[data-del]'))return;
 const id=e.target.closest('.ar').dataset.id;
 if(confirm('Delete this service?')){services=services.filter(s=>s.id!==id);delete sel[id];save();adminView()}
});

/* Native (Android) helpers */
const CAP=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?window.Capacitor:null;
async function savePdf(d,name){
 const C=CAP();
 if(C){try{const r=await C.Plugins.Filesystem.writeFile({path:name,data:d.output('datauristring').split(',')[1],directory:'CACHE'});
  await C.Plugins.Share.share({title:'SINIKAT Quotation',url:r.uri,dialogTitle:'Share quotation PDF'})}catch(e){toast('Could not create PDF')}}
 else d.save(name);
}
$('#bs').onclick=async()=>{
 const t=qtext(),C=CAP();
 try{if(C)await C.Plugins.Share.share({title:'SINIKAT Quotation',text:t,dialogTitle:'Share quotation'});
  else if(navigator.share)await navigator.share({title:'SINIKAT Quotation',text:t});
  else $('#bc').click()}catch(e){}
};
/* History */
let hist=store.get('sk_hist',[]);
function saveHist(q){hist.unshift(q);store.set('sk_hist',hist)}
$('#hist').onclick=()=>{histView();$('#hm').classList.add('show')};
function histView(){
 $('#hbody').innerHTML='<h2>Quotation history</h2><input type="text" id="hs" placeholder="Search name, project or date" aria-label="Search quotations"><div id="hl" style="margin-top:12px"></div><button class="btn d" id="hda">Delete all</button><button class="btn p" id="hc">Close</button>';
 const draw=()=>{const k=$('#hs').value.toLowerCase();
  const L=hist.filter(h=>[h.name,h.contact,h.proj,h.date].join(' ').toLowerCase().includes(k));
  $('#hl').innerHTML=L.length?L.map(h=>`<div class="ar" data-id="${h.id}" style="grid-template-columns:1fr auto"><div><b>${esc(h.name)}</b><div class="pr">${h.date}${h.proj?' – '+esc(h.proj):''}</div><div class="lt" style="text-align:left">${peso(h.total)}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" data-v>View</button><button class="btn sm d" data-x>Delete</button></div></div>`).join(''):'<p class="pr">No quotations found.</p>'};
 draw();$('#hs').oninput=draw;
 $('#hc').onclick=()=>$('#hm').classList.remove('show');
 $('#hda').onclick=()=>{if(hist.length&&confirm('Delete all saved quotations?')){hist=[];store.set('sk_hist',hist);draw()}};
 $('#hl').onclick=e=>{const r=e.target.closest('.ar');if(!r)return;const h=hist.find(x=>String(x.id)===r.dataset.id);if(!h)return;
  if(e.target.matches('[data-v]')){Q=h;$('#hm').classList.remove('show');showQuote()}
  else if(e.target.matches('[data-x]')&&confirm('Delete this quotation?')){hist=hist.filter(x=>x!==h);store.set('sk_hist',hist);draw()}};
}
render();
</script>
